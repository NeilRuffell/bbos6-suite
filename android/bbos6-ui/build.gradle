plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android' version '2.4.21'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.4.21'
}

android {
    namespace 'dev.q25.bbos6.ui'
    compileSdk 35

    defaultConfig {
        minSdk 23
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        compose true
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2025.04.01')
    implementation composeBom
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.ui:ui'
    // ComposeView inside native Dialog needs the host Activity's lifecycle,
    // saved-state and viewmodel tree owners; reused in app-neutral bridges.
    implementation 'androidx.activity:activity:1.10.1'
    testImplementation 'junit:junit:4.13.2'
}


/**
 * Keep reusable BBOS6 UI source and tests Kotlin-only. This deliberately
 * checks src/ rather than generated build/ files so Android/Compose tooling
 * may still generate Java bytecode or stubs as needed.
 */
tasks.register('verifyKotlinOnly') {
    group = 'verification'
    description = 'Reject maintained Java source in the shared BBOS6 UI module'
    doLast {
        def javaFiles = fileTree('src').matching { include '**/*.java' }.files
        if (!javaFiles.isEmpty()) {
            throw new GradleException(
                'Shared BBOS6 UI must not contain Java source: ' +
                javaFiles.collect { it.path }.join(', ')
            )
        }
    }
}
tasks.named('preBuild') {
    dependsOn tasks.named('verifyKotlinOnly')
}
