name: Release BB Music APK

# A pushed version tag from the music-app branch triggers this workflow.
# Tag-triggered workflows work even when the repository's default branch
# (main) differs from the active development branch (master).
# The signing key must never be committed to this public repository.
on:
  push:
    tags:
      - 'bb-music-v*'

permissions:
  contents: write

concurrency:
  group: release-bb-music
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        env:
          ANDROID_HOME: ${{ runner.temp }}/android-sdk
          ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl --fail --location --retry 3 \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            --output /tmp/android-cmdline-tools.zip
          unzip -q /tmp/android-cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          (yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null) || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Check release signing secrets
        env:
          BB_MUSIC_KEYSTORE_BASE64: ${{ secrets.BB_MUSIC_KEYSTORE_BASE64 }}
          BB_MUSIC_KEYSTORE_PASSWORD: ${{ secrets.BB_MUSIC_KEYSTORE_PASSWORD }}
        run: |
          if [[ -z "$BB_MUSIC_KEYSTORE_BASE64" || -z "$BB_MUSIC_KEYSTORE_PASSWORD" ]]; then
            echo "::error::Configure BB_MUSIC_KEYSTORE_BASE64 and BB_MUSIC_KEYSTORE_PASSWORD as repository Actions secrets before releasing."
            exit 1
          fi

      - name: Build non-debuggable release APK
        run: gradle -p music-app :app:assembleRelease --no-daemon --stacktrace

      - name: Align, sign and verify release APK
        env:
          BB_MUSIC_KEYSTORE_BASE64: ${{ secrets.BB_MUSIC_KEYSTORE_BASE64 }}
          BB_MUSIC_KEYSTORE_PASSWORD: ${{ secrets.BB_MUSIC_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          SDK_BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          UNSIGNED="music-app/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="$RUNNER_TEMP/app-release-aligned.apk"
          KEYSTORE="$RUNNER_TEMP/bb-music-release.p12"
          SIGNED="$RUNNER_TEMP/BBMusic-signed.apk"
          test -f "$UNSIGNED"
          printf '%s' "$BB_MUSIC_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          trap 'rm -f "$KEYSTORE"' EXIT
          "$SDK_BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED" "$ALIGNED"
          "$SDK_BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-type PKCS12 \
            --ks-key-alias bbmusic \
            --ks-pass env:BB_MUSIC_KEYSTORE_PASSWORD \
            --key-pass env:BB_MUSIC_KEYSTORE_PASSWORD \
            --out "$SIGNED" "$ALIGNED"
          "$SDK_BUILD_TOOLS/apksigner" verify --verbose --print-certs "$SIGNED"
          VERSION_NAME=$("$SDK_BUILD_TOOLS/aapt" dump badging "$SIGNED" \
            | sed -nE "s/.*versionName='([^']+)'.*/\1/p" | head -n 1)
          if [[ ! "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Unsupported or missing versionName in built APK."
            exit 1
          fi
          RELEASE_APK="BBMusic-${VERSION_NAME}.apk"
          RELEASE_TAG="bb-music-v${VERSION_NAME}"
          if [[ "$GITHUB_REF_TYPE" != "tag" || "$GITHUB_REF_NAME" != "$RELEASE_TAG" ]]; then
            echo "::error::Release tag must match the built APK versionName ($RELEASE_TAG)."
            exit 1
          fi
          mv "$SIGNED" "$RELEASE_APK"
          echo "RELEASE_APK=$RELEASE_APK" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

      - name: Upload installable APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: bb-music-signed-release-apk
          path: BBMusic-*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $RELEASE_TAG already exists. Increment the music-app versionCode and versionName before creating another release."
            exit 1
          fi
          gh release create "$RELEASE_TAG" "$RELEASE_APK" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "BB Music v${VERSION_NAME}" \
            --notes "Standalone, release-signed Android APK for direct installation (dev.q25.bbmusic). Android 13 or newer. Not a debug build."
