plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android' version '2.4.21'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.4.21'
    id 'org.jetbrains.kotlin.kapt' version '2.4.21'
}

android {
    namespace 'dev.q25.bbmusic'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.q25.bbmusic'
        minSdk 33
        targetSdk 35
        versionCode 2
        versionName '0.1.1'
    }
    // Match TV-DV's ordinary local Release workflow: Gradle automatically
    // signs the APK with the existing, reusable local Android debug identity.
    // No separate signing scripts or per-build certificates.
    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        compose true
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

// An ordinary Android application: no BB UI module dependency, no
// Xposed/Vector, SystemUI APIs, root, privileged permissions, or audio engine.

dependencies {
    // Shared BBOS6 Compose UI: application presentation, not playback logic.
    implementation platform('androidx.compose:compose-bom:2025.04.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    // Supplies LifecycleOwner and SavedStateRegistryOwner to Compose-backed rows.
    implementation 'androidx.activity:activity:1.10.1'
    // Native, reusable BBOS6 property popup; no music-specific code.
    implementation project(':bbos6-ui')

    // Standalone first-party player, independent of Symfonium and BB UI.
    // Same stable Media3 version for player, session, and MediaController.
    def media3Version = '1.9.4'
    implementation "androidx.media3:media3-exoplayer:$media3Version"
    implementation "androidx.media3:media3-session:$media3Version"
    // Durable, private SQLite catalog; kapt processes Kotlin Room entities/DAOs.
    def roomVersion = '2.8.5'
    implementation "androidx.room:room-runtime:$roomVersion"
    kapt "androidx.room:room-compiler:$roomVersion"
    // Room 2.8.5 resolves a pre-2.4 metadata reader on kapt's processor path.
    // The Kotlin 2.4.21 stubs require a metadata reader with 2.4 support.
    // Keep this on kapt only; it does not change runtime/database dependencies.
    kapt 'org.jetbrains.kotlin:kotlin-metadata-jvm:2.4.21'
    testImplementation 'junit:junit:4.13.2'
}
