plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android' version '2.4.21'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.4.21'
}

android {
    namespace 'dev.q25.bbmessages'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.q25.bbmessages'
        minSdk 33
        targetSdk 28
        versionCode 1
        versionName '0.1.0-inspection'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { compose true }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    implementation project(':bbos6-ui')
    implementation platform('androidx.compose:compose-bom:2025.04.01')
    implementation 'androidx.compose.ui:ui'
    // Injected Compose rows explicitly reference these ViewTree owner classes.
    // Shared module implementation dependencies are not our compile API.
    implementation 'androidx.lifecycle:lifecycle-runtime:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.7'
    implementation 'androidx.savedstate:savedstate:1.2.1'
    compileOnly 'de.robv.android.xposed:api:82'
    testImplementation 'junit:junit:4.13.2'
}
