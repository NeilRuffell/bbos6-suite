plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.q25.bbmessages'
    compileSdk 35

    defaultConfig {
        // Keep the original module application ID: installing -r upgrades
        // the existing research module without uninstalling or clearing data.
        applicationId 'dev.q25.bbmessages'
        minSdk 33
        targetSdk 28
        versionCode 1
        versionName '0.1.0-rcs-research'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
    testImplementation 'junit:junit:4.13.2'
}
